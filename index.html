<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>綠綠賞卡片</title>
    <link rel="stylesheet" href="card.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- iOS specific meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="會員卡_v5.1">
    <meta name="format-detection" content="telephone=no">
   <!-- iOS icons -->
    <link rel="apple-touch-icon" sizes="152x152" href="icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
    <link rel="apple-touch-icon" sizes="167x167" href="icon.png">
    <link rel="apple-touch-icon" sizes="192x192" href="icon.png">
    
    <!-- QR Code 生成库 -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header-container">
            <h1>綠綠賞會員卡</h1>
             <!-- 臨時  <div class="filter-icons">
                <div class="filter-icon active" data-filter="all" title="全部">
                    <i class="fas fa-th"></i>
                </div>
                <div class="filter-icon" data-filter="phone" title="電話卡">
                    <i class="fas fa-mobile-alt"></i>
                </div>
                <div class="filter-icon" data-filter="physical" title="實體卡">
                    <i class="fas fa-address-card"></i>
                </div>
                <div class="filter-icon" data-filter="physical2" title="實體卡2">
                    <i class="fas fa-address-card"></i>
                </div>
                <div class="filter-icon" data-filter="physical3" title="新實體卡">
                    <i class="fas fa-address-card"></i>
                </div>
            </div> -->
        </div>
        <div class="cards-container"></div>
    </div>
    
    <script>
        // 卡片数据
        const cardData = [
            { memberId: "4506358841", cardType: "電話:69223825" },
            { memberId: "0362016724", cardType: "電話:46404014" },
            { memberId: "0441236134", cardType: "電話:62352594" },
            { memberId: "8855917996", cardType: "電話:54880501" },
            { memberId: "6186573189", cardType: "電話:91425065" },
        ];
        const baseUrl = 'https://www.wastereduction.gov.hk/tc/pilot_smart_recycling_system.htm?card=';
        
        // 生成QR Code的函数
        function generateQRCode(memberId) {
            const url = baseUrl + memberId;
            // 直接使用在线QR Code生成服务
            return `https://api.qrserver.com/v1/create-qr-code/?size=128x128&data=${encodeURIComponent(url)}`;
        }
    
        function generateCard(memberId, cardType) {
            const qrCodeSrc = generateQRCode(memberId);
            return `
                <div class="card-container">
                    <div class="member-header" data-member-id="${memberId}">
                        <div class="member-id">編號：${memberId}</div>
                        <div class="alert"></div>
                    </div>
                    <div class="card-content-wrapper">
                        <div class="green-card-container">
                            <div class="card-type">${cardType}</div>
                            <div class="qrcode-container">
                                <img src="${qrCodeSrc}" alt="QR Code" style="width: 150px; height: 150px;">
                            </div>
                            <div class="card-checks">
                                <h2>取禮卷</h2>
                                <label class="switch">
                                    <input type="checkbox" class="giftCheck">
                                    <span class="slider"></span>
                                </label>
                                 <h2>已轉電話</h2>
                                <label class="switch">
                                    <input type="checkbox" class="phoneCheck">
                                    <span class="slider"></span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            const cardsContainer = document.querySelector('.cards-container');
            
            // 清空现有内容
            cardsContainer.innerHTML = '';
    
            // 生成所有卡片
            let lastCardType = '';
            cardData.forEach((card, index) => {
                // 获取卡片的基本类型（电话卡、实体卡或实体卡2）
               const currentType = card.cardType.startsWith('電話') ? '電話卡'
                    : card.cardType.startsWith('臨時')? '臨時卡'
                    : card.cardType;
                
                // 如果当前卡片类型与上一个不同，且不是第一个卡片，添加分隔线
                if (lastCardType !== '' && currentType !== lastCardType) {
                    cardsContainer.innerHTML += `<hr style="border-color:#f00; width: 99%; height: 0px; margin: 5px 0;">`;
                }
                
                const cardHTML = generateCard(card.memberId, card.cardType);
                cardsContainer.innerHTML += cardHTML;
                lastCardType = currentType;
            });
        });
    </script>
    <script src="CardManager.js"></script>
</body>
</html>
